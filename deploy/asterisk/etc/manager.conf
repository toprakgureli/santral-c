; AMI, used by the Go control plane to observe calls (CDR, timeline and
; RTCP quality) and to originate click-to-call. Dev credentials only; the
; permit range must be tightened for anything beyond local development.
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0

[santral]
secret = santral-ami-secret
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
permit = 10.0.0.0/255.0.0.0
permit = 172.16.0.0/255.240.0.0
permit = 192.168.0.0/255.255.0.0
read = system,call,dialplan,cdr,agent,user,reporting
write = system,call,originate,reporting,command
