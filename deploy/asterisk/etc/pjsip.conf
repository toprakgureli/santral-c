;==============================================================================
; santral-c PJSIP configuration.
;
; Two transports: UDP for trunk/testing, WebSocket for browser softphones.
; Agent endpoints 1001 and 1002 are WebRTC (browser). 9001 and 9002 are plain
; UDP endpoints used for headless testing. Per-user endpoints are appended to
; pjsip_users.conf by the provisioning service and pulled in by the include
; at the end of this file.
;==============================================================================

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0:8088

;--- Templates ----------------------------------------------------------------

[endpoint-webrtc](!)
type = endpoint
context = santral-internal
disallow = all
allow = opus,ulaw,alaw
webrtc = yes
dtls_auto_generate_cert = yes
direct_media = no

[endpoint-udp](!)
type = endpoint
context = santral-internal
disallow = all
allow = opus,ulaw,alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[auth-userpass](!)
type = auth
auth_type = userpass

[aor-single](!)
type = aor
max_contacts = 1
remove_existing = yes

;--- Browser agents (WebRTC) --------------------------------------------------

[1001](endpoint-webrtc)
auth = 1001
aors = 1001
callerid = Agent 1001 <1001>
[1001](auth-userpass)
username = 1001
password = agent1001pass
[1001](aor-single)

[1002](endpoint-webrtc)
auth = 1002
aors = 1002
callerid = Agent 1002 <1002>
[1002](auth-userpass)
username = 1002
password = agent1002pass
[1002](aor-single)

;--- Headless test agents (UDP) -----------------------------------------------

[9001](endpoint-udp)
auth = 9001
aors = 9001
callerid = Test 9001 <9001>
[9001](auth-userpass)
username = 9001
password = test9001pass
[9001](aor-single)

[9002](endpoint-udp)
auth = 9002
aors = 9002
callerid = Test 9002 <9002>
[9002](auth-userpass)
username = 9002
password = test9002pass
[9002](aor-single)

#include pjsip_users.conf
