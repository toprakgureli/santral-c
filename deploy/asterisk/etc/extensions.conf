[general]
static = yes
writeprotect = yes

[globals]

; Internal dialing between agents plus a couple of audio self-tests.
[santral-internal]
exten => _10XX,1,NoOp(internal ${CALLERID(num)} calling ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

exten => _90XX,1,NoOp(test ${CALLERID(num)} calling ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; 600 echoes audio back to the caller; 601 plays a reference tone.
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => 601,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()
