# santral-c reverse proxy for cm.toprakgureli.com
#
# Cloudflare terminates HTTPS at the edge and connects to this origin over
# HTTPS too (SSL mode "Full (strict)"), with a Cloudflare Origin
# Certificate kept in /etc/ssl/cloudflare/ (DEPLOY.md, section 7). Port 80
# answers the same, so the site keeps working while Cloudflare is switched
# over; Cloudflare's "Always Use HTTPS" sends browsers to HTTPS.
#
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled/,
# then: nginx -t && systemctl reload nginx. nginx -t fails while the
# certificate files are missing; the running configuration then stays.

# --- Restore the real visitor IP from Cloudflare --------------------------
# So access logs and the app's X-Forwarded-For carry the true client IP.
# Refresh the list from https://www.cloudflare.com/ips/ when it changes.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- Rate limit for the addresses Meta and Tally call ----------------------
# They take no panel session, so they are the easiest to flood. Meta sends
# in bursts, hence the generous burst allowance.
limit_req_zone $binary_remote_addr zone=santral_hooks:10m rate=50r/s;
limit_req_status 429;

# --- Large uploads ---------------------------------------------------------
# At most four uploads at once from one address, so nobody can tie up the
# server's memory with a crowd of large bodies.
limit_conn_zone $binary_remote_addr zone=santral_uploads:10m;
limit_conn_status 429;

server {
    # "listen ... http2" is the form nginx 1.24 (Ubuntu 24.04) understands.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 80;
    listen [::]:80;
    server_name cm.toprakgureli.com;

    ssl_certificate     /etc/ssl/cloudflare/cm.toprakgureli.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/cm.toprakgureli.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Vite build output. deploy.sh copies frontend/dist here.
    root /var/www/santral-c;
    index index.html;

    client_max_body_size 8m;   # escalation Excel/CSV import

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Chat attachments stream from Google Drive through the backend. No
    # buffering and long timeouts, so a multi-gigabyte file flows straight
    # to the browser instead of being spooled to disk first.
    location /api/v1/teams/attachments/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # WhatsApp webhook and survey answers: small notices from Meta and
    # Tally. Kept to 1 MB and rate limited; the app checks the same.
    location ~ ^/api/v1/wa/(hook|survey)/ {
        limit_req zone=santral_hooks burst=300 nodelay;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # WhatsApp files sent to customers (documents up to 100 MB): the only
    # addresses that take large bodies. nginx first asks the backend whether
    # the request carries a valid session, before reading the body, so a
    # stranger cannot fill the server's memory with large requests.
    location ~ ^/api/v1/wa/(files|templates/media|conversations/[0-9]+/media)$ {
        auth_request /_session;
        limit_conn santral_uploads 4;
        client_max_body_size 110m;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The session check above: the panel's "who am I", without the body.
    # Needs nginx's auth_request module (part of Ubuntu's nginx).
    location = /_session {
        internal;
        proxy_method GET;
        proxy_pass http://127.0.0.1:8090/api/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WhatsApp: the panel's requests and media streamed back from Drive. No
    # buffering of answers and longer timeouts; bodies stay small (8 MB).
    # The live stream pings every 20 seconds.
    location /api/v1/wa/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API -> Go backend on the loopback.
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # real client (real_ip restored)
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # From outside, the backend answers only "ok" here; the address header
    # tells it the caller is not the server itself.
    location = /healthz {
        proxy_pass http://127.0.0.1:8090/healthz;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Caching is set with "expires" rather than add_header: a location
    # with its own add_header drops the security headers below, and the
    # panel page needs them most.
    #
    # SPA: hashed assets never change; everything else falls back to
    # index.html.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The shell must never go stale: a cached index.html points at old
    # bundles and people end up running last week's softphone.
    location = /index.html {
        expires epoch;
        try_files $uri =404;
    }

    location / {
        expires epoch;
        try_files $uri $uri/ /index.html;
    }

    # Every answer: no guessing of file types, no showing the panel inside
    # another site's frame, no full addresses sent to other sites, and
    # browsers keep to HTTPS for a year.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
