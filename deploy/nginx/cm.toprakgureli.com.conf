# santral-c reverse proxy for cm.toprakgureli.com
#
# Cloudflare terminates HTTPS at the edge and proxies to this origin. With
# Cloudflare SSL mode "Flexible" this HTTP (:80) block is enough. For "Full
# (strict)" install a Cloudflare Origin Certificate and add the :443 server
# block noted at the bottom.
#
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled/,
# then: nginx -t && systemctl reload nginx

# --- Restore the real visitor IP from Cloudflare --------------------------
# So access logs and the app's X-Forwarded-For carry the true client IP.
# Refresh the list from https://www.cloudflare.com/ips/ when it changes.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name cm.toprakgureli.com;

    # Vite build output. deploy.sh copies frontend/dist here.
    root /var/www/santral-c;
    index index.html;

    client_max_body_size 8m;   # escalation Excel/CSV import

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API -> Go backend on the loopback.
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # real client (real_ip restored)
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8090/healthz;
    }

    # SPA: hashed assets are immutable; everything else falls back to index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# --- Full (strict) origin TLS (optional) ---------------------------------
# Create an Origin Certificate in Cloudflare (SSL/TLS > Origin Server), save
# the cert and key on the host, then replace the server block above with a
# :443 block:
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name cm.toprakgureli.com;
#     ssl_certificate     /etc/ssl/cloudflare/cm.toprakgureli.com.pem;
#     ssl_certificate_key /etc/ssl/cloudflare/cm.toprakgureli.com.key;
#     ... (same root / location blocks) ...
# }
# server { listen 80; server_name cm.toprakgureli.com; return 301 https://$host$request_uri; }
