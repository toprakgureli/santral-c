# santral-c: a WhatsApp webhook that is already registered in Meta
#
# Use this when Meta keeps sending to an address set up for an earlier
# system and nobody can change it in Meta's developer screens. The earlier
# system listened on port 5001 behind Cloudflare; this block takes that
# port over and hands the requests to santral-c. The panel decides which
# paths are webhooks (WhatsApp > Ayarlar > Cihazlar > "Meta'da zaten
# kayıtlı bir webhook"); any other path answers 404.
#
# Install, in this order:
#   1. stop the earlier system so the port is free, and keep it from
#      starting again (systemctl stop <service>; systemctl disable <service>)
#   2. copy this file to /etc/nginx/sites-available/, symlink it into
#      sites-enabled/, then: nginx -t && systemctl reload nginx
#   3. in the panel, fill in the registered address on the number
#
# To go back, remove the symlink, reload nginx and start the earlier
# system again.

# Meta sends in bursts; anything far beyond that is not Meta.
limit_req_zone $binary_remote_addr zone=santral_existing_hook:10m rate=50r/s;

server {
    listen 5001;
    listen [::]:5001;
    server_name _;

    # A notice is a few kilobytes; the app refuses more than 1 MB as well.
    client_max_body_size 1m;
    limit_req zone=santral_existing_hook burst=300 nodelay;
    limit_req_status 429;

    # The panel's own API is not served on this port.
    location /api/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
