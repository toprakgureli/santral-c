# Monitoring for santral-c: Prometheus keeps the numbers, Jaeger the
# traces, Grafana shows both with a ready dashboard and alerts.
#
# Everything listens on 127.0.0.1 only; reach Grafana through an SSH tunnel
# (see DEPLOY.md). Start with:
#   sudo docker compose -f /opt/santral-c/deploy/observability/docker-compose.yml up -d
#
# Prometheus and Grafana share the host's network so Prometheus can read the
# backend's /metrics, which answers only on the server itself. node_exporter
# reports the host's disks, memory and processor; it sees the host's file
# system read-only under /host.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
    read_only: true
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    ports:
      - "127.0.0.1:16686:16686" # web screen
      - "127.0.0.1:4318:4318"   # traces from the backend (OTLP over HTTP)
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.1.0
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DEFAULT_LANGUAGE: tr-TR
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
