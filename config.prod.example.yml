# Production config for cm.toprakgureli.com.
# Copy to config.yml on the server and fill every "change-me" value.
# NEVER commit the filled-in file: config.yml is gitignored.
app:
  name: santral-c
  development: live
  host: "127.0.0.1"         # only nginx on this machine reaches the backend
  port: "8090"
  # nginx runs on the same host, so trust the loopback proxy. This makes the
  # backend read the real client IP from X-Forwarded-For (set by nginx from
  # Cloudflare's CF-Connecting-IP) for audit trails and lockouts.
  trustedProxies: "127.0.0.1"
  corsOrigins: ""           # empty: frontend and API are same-origin
  publicUrl: "https://cm.toprakgureli.com"

auth:
  secret: "change-me-to-a-long-random-secret"   # openssl rand -hex 32
  accessTTL: 15m
  refreshTTL: 168h          # everyone signs in again once a week
  issuer: santral-c
  cookieName: santral_access
  refreshCookieName: santral_refresh
  cookieSecure: true        # required: the site is served over HTTPS

security:
  # Wrong passwords are counted per browser (deviceFailureLimit) and per
  # account first. An address is banned only after many failures, and never
  # when it is in trustedIPs: put the office's public address there.
  ipFailureLimit: 100
  ipBanDuration: 15m
  accountLockDuration: 15m
  distinctIPLimit: 5
  attemptWindow: 15m
  mfaKey: "change-me-to-a-32-byte-mfa-key"       # openssl rand -hex 16
  # Encrypts integration secrets kept in the database (WhatsApp tokens, the
  # Google Drive link); separate from auth.secret. openssl rand -hex 32
  # To replace it, put the old key in previousDataKeys and restart: stored
  # secrets are sealed again with the new key at start.
  dataKey: "change-me-to-a-64-character-random-data-key"
  previousDataKeys: ""
  deviceFailureLimit: 5
  trustedIPs: ""            # office address or range, e.g. "203.0.113.7" or "203.0.113.0/28"
  requireMFA: true          # force TOTP MFA enrollment at first login

owner:
  name: "Toprak Gureli"
  email: "owner@toprakgureli.com"
  password: "change-me-on-first-login"           # simple; changed at first login

database:
  host: localhost
  port: "5432"
  name: santral
  user: santral
  password: "change-me-strong-db-password"
  sslMode: disable
  timeZone: Europe/Istanbul
  debug: false

redis:
  host: localhost
  port: "6379"
  password: ""
  db: 0

bulutsantralim:
  enabled: true
  # Copy these four+ values verbatim from your working local config.yml.
  apiKey: "change-me-bulutsantralim-api-key"
  apiBase: "https://api.bulutsantralim.com"
  webphoneBase: "https://oim.verimor.com.tr/webphone"
  sipDomain: "change-me.bulutsantralim.com"
  sipWssUrl: "wss://api.bulutsantralim.com:7443"
  stunUrl: "stun:194.49.126.36:7443"
  turnUrl: ""
  turnUser: ""
  turnPass: ""
  sipKey: "change-me-to-a-32-byte-sip-key"        # openssl rand -hex 16
  historyDays: 90

# Google Drive for Teams attachments (pictures, videos, files). Only the
# OAuth client goes here; the account itself is linked once from
# Yönetim > Sistem Ayarları > Teams Dosya Depolama.
#
# Google Cloud Console > APIs & Services > Credentials > OAuth client ID
# (Web application). Authorized redirect URI must be exactly redirectUrl.
drive:
  clientId: ""
  clientSecret: ""
  redirectUrl: "https://cm.example.com/api/v1/teams/drive/callback"
  folderName: "SantralC"

# Monitoring. Metrics are always on /metrics (read by Prometheus on the
# server itself); traces go to Jaeger when otlpEndpoint is set. See
# deploy/observability and DEPLOY.md.
telemetry:
  otlpEndpoint: "http://127.0.0.1:4318"
  sampleRatio: 0.2          # share of requests traced (0 to 1)
