# Copy to config.yml and adjust. config.yml is gitignored.
app:
  name: santral-c
  development: test
  port: "8080"
  trustedProxies: ""
  corsOrigins: "http://localhost:5173"
  publicUrl: "http://localhost:8080"

auth:
  secret: "change-me-to-a-long-random-secret"
  accessTTL: 24h
  refreshTTL: 720h
  issuer: santral-c
  cookieName: santral_access
  refreshCookieName: santral_refresh
  cookieSecure: false

security:
  ipFailureLimit: 10
  ipBanDuration: 15m
  accountLockDuration: 15m
  distinctIPLimit: 5
  attemptWindow: 15m
  mfaKey: "change-me-to-a-32-byte-mfa-key"
  trustedIPs: ""
  # When true, every non-exempt user must set up TOTP MFA at first login.
  # Only seeded on a fresh database (an admin's later change is preserved).
  requireMFA: false

owner:
  name: "Owner"
  email: "owner@santral.local"
  password: "change-me-on-first-login"

database:
  host: localhost
  port: "5432"
  name: santral
  user: santral
  password: santral
  sslMode: disable
  timeZone: Europe/Istanbul
  debug: false

redis:
  host: localhost
  port: "6379"
  password: ""
  db: 0

bulutsantralim:
  enabled: true
  # API key from OIM > Bulut Santralım > Santral Ayarlarım.
  apiKey: "your-bulutsantralim-api-key"
  apiBase: "https://api.bulutsantralim.com"
  webphoneBase: "https://oim.verimor.com.tr/webphone"
  # WebRTC softphone (SIP over WSS): the domain is the X-Lite "Santral Adı",
  # the WSS URL is Verimor's WebRTC signaling endpoint. TURN is recommended
  # for agents behind NAT.
  sipDomain: "your-pbx.bulutsantralim.com"
  sipWssUrl: "wss://your-pbx-webrtc-endpoint/ws"
  stunUrl: ""
  turnUrl: ""
  turnUser: ""
  turnPass: ""
  sipKey: "change-me-to-a-32-byte-sip-key"
  # Days of call history to mirror locally on first run (newer calls arrive
  # with the regular poll). Searching runs on this mirror.
  historyDays: 90
