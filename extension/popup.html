<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light dark; --bg:#fff; --fg:#1b1e24; --muted:#6b7280; --input:#f1f3f5; --border:#e5e7eb; --accent:#2f59c4; }
      @media (prefers-color-scheme: dark){ :root{ --bg:#1f2329; --fg:#f3f4f6; --muted:#9aa1ad; --input:#2a2f37; --border:#343a44; --accent:#5b8cff; } }
      body { width: 300px; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      label { display:block; font-size: 11px; color: var(--muted); margin: 8px 0 3px; }
      input { width: 100%; height: 32px; border: 1px solid var(--border); background: var(--input); color: var(--fg); border-radius: 8px; padding: 0 8px; outline: none; box-sizing: border-box; }
      button { width: 100%; height: 34px; border: 0; border-radius: 9px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; margin-top: 10px; }
      .sec { background: transparent; color: var(--accent); border: 1px solid var(--border); }
      .msg { font-size: 11px; color: var(--muted); margin-top: 8px; min-height: 14px; }
    </style>
  </head>
  <body>
    <h1>SantralC Mini · Ayarlar</h1>
    <label>Dahili</label><input id="ext" placeholder="1014" />
    <label>SIP parola</label><input id="password" type="password" placeholder="•••••" />
    <label>WSS adresi</label><input id="wss" placeholder="wss://api.bulutsantralim.com:7443" />
    <label>SIP domain</label><input id="domain" placeholder="ersinhacioglu.bulutsantralim.com" />
    <label>STUN (opsiyonel)</label><input id="stun" placeholder="stun:194.49.126.36:7443" />
    <button id="save">Kaydet ve Bağlan</button>
    <button id="mic" class="sec">Mikrofon İznini Ver</button>
    <div class="msg" id="msg"></div>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
