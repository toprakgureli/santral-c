# Compose file for a Dokploy "Compose" service.
#
# Differences from docker-compose.yml:
#   - no published ports: Dokploy's Traefik reaches the frontend through the
#     domain set in the panel (service "frontend", port 80);
#   - config.yml comes from a Dokploy file mount (Advanced > Mounts, path
#     "config.yml"), which Dokploy keeps in ../files next to the checkout;
#   - Redis requires the password from config.yml (REDIS_PASSWORD) and the
#     database password is POSTGRES_PASSWORD; both are set in the panel's
#     Environment tab.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: santral
      POSTGRES_USER: santral
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Europe/Istanbul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santral -d santral"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8090"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: santral
      DATABASE_USER: santral
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Europe/Istanbul
    volumes:
      - ../files/config.yml:/app/config.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
