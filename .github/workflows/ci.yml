name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: santral_test
          POSTGRES_USER: santral
          POSTGRES_PASSWORD: santral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U santral"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SANTRAL_TEST_DSN: host=localhost user=santral password=santral dbname=santral_test sslmode=disable
      SANTRAL_TEST_REDIS: localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run ./...

      - name: pg_dump for the backup test
        run: |
          sudo apt-get update -qq
          # The distribution's client, whatever its version: a newer pg_dump
          # copies an older server too, so a runner image change keeps working.
          sudo apt-get install -y -qq postgresql-client
          pg_dump --version

      - name: Test
        run: go test -race -short -count=1 ./...

      # The office's busy minute on a database with half a year of history,
      # all from one address. Without the race detector, which would make it
      # minutes long.
      - name: Load tests
        run: go test -count=1 -run 'TestLoad|TestPermissionMatrix' -v ./cmd/santral

      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build
        run: go build -trimpath -o /dev/null ./cmd/santral

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The same install the server does: no package install scripts.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # deploy.sh against a stand-in server: a good release, a failed one
      # that rolls back, a config the new version refuses, local changes, a
      # long migration, a full disk, a failed copy, an edited unit file.
      - run: bash deploy/test/deploy_test.sh
