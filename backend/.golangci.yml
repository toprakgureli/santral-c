version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errorlint
    - revive
    - unconvert
  settings:
    staticcheck:
      checks:
        - all
        # A negated group ("not an admin and not a Teams admin") reads like
        # the rule it implements; spreading the negation over it does not.
        - -QF1001
        # Doc comments are checked by revive's exported rule instead.
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022
    revive:
      rules:
        - name: exported
        - name: error-naming
        - name: error-strings
        - name: indent-error-flow
        - name: receiver-naming
        - name: var-naming
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/toprakgureli/santral-c/backend
